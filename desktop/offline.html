<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>VUNLEK · Sin conexión</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f8fafc;font-family:Segoe UI,Arial,sans-serif;color:#0f172a}
  .card{background:#fff;border-radius:24px;padding:40px;max-width:420px;text-align:center;box-shadow:0 10px 30px rgba(15,23,42,.08)}
  h1{font-size:22px;margin:0 0 8px} p{color:#475569;line-height:1.5}
  button{margin-top:16px;background:#4f46e5;color:#fff;border:0;border-radius:14px;padding:14px 24px;font-size:16px;font-weight:700;cursor:pointer}
</style></head>
<body><div class="card">
  <h1>No hay conexión a internet</h1>
  <p>VUNLEK necesita internet para abrir. Revisa el Wi-Fi o el cable de red y vuelve a intentar.</p>
  <button onclick="location.href=new URLSearchParams(location.search).get('url')||'https://www.vunlek.com'">Reintentar</button>
</div></body></html>
