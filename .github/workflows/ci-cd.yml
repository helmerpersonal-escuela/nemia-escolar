name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # --ignore-scripts: evita que el paquete `supabase` descargue su CLI en cada build
      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Revisar tipos (TypeScript)
        run: npm run typecheck

      # La deuda de advertencias solo puede bajar: si alguien agrega nuevas, el CI falla.
      # Cuando se corrijan advertencias, baja el número en package.json (lint:ci).
      - name: Lint
        run: npm run lint:ci

      - name: Pruebas unitarias
        run: npm run test:run

      - name: Compilar web
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder

      - name: Guardar build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/

  build-android:
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Descargar build web
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Compilar APK (debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: vunlek-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # iOS requiere macOS y certificados: se compila localmente con Xcode.
